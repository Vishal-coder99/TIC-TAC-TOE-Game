<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic&nbsp;Tac&nbsp;Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="eyebrow">Local Two-Player</div>
  <h1><span class="x">Tic</span>·<span class="o">Tac</span>·Toe</h1>

  <div class="status" id="status">
    <span class="turn-dot" id="turnDot"></span>
    <span id="statusText">Player X's turn</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <svg class="win-line" id="winLine" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  </div>

  <div class="controls">
    <button class="action btn-primary" id="newRound">New Round</button>
    <button class="action btn-ghost" id="resetScore">Reset Score</button>
  </div>

  <div class="scoreboard">
    <div class="score x">
      <div class="label">Player X</div>
      <div class="value" id="scoreX">0</div>
    </div>
    <div class="score d">
      <div class="label">Draws</div>
      <div class="value" id="scoreD">0</div>
    </div>
    <div class="score o">
      <div class="label">Player O</div>
      <div class="value" id="scoreO">0</div>
    </div>
  </div>
  <h4>Developed ❤️ by Vishal</h2>
</div>

<script src="script.js"></script>
</body>
</html>
